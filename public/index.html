<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hoop Trains</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #12121f; color: #e8e8f0; font-family: system-ui, -apple-system, sans-serif; }

.screen {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; min-height: 100dvh; padding: 28px 24px; max-width: 440px; margin: 0 auto;
}
.screen.active { display: flex; }

.title  { font-size: 30px; font-weight: 900; letter-spacing: -1px; }
.sub    { font-size: 14px; color: rgba(255,255,255,0.4); text-align: center; line-height: 1.65; }
.err    { font-size: 13px; color: #ff6b6b; min-height: 18px; text-align: center; }

.btn-host {
  width: 100%; padding: 17px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  background: rgba(180,180,220,0.1); border: 1px solid rgba(180,180,220,0.4); color: #c8c8e8;
  -webkit-tap-highlight-color: transparent;
}
.btn-host:active:not(:disabled) { background: rgba(180,180,220,0.22); }
.btn-host:disabled { opacity: 0.4; cursor: default; }

.btn-p1 {
  width: 100%; padding: 17px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  background: rgba(110,198,245,0.12); border: 1px solid rgba(110,198,245,0.5); color: #6ec6f5;
  -webkit-tap-highlight-color: transparent;
}
.btn-p1:active:not(:disabled) { background: rgba(110,198,245,0.25); }
.btn-p1:disabled { opacity: 0.4; cursor: default; }

.btn-p2 {
  width: 100%; padding: 17px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  background: rgba(245,160,110,0.12); border: 1px solid rgba(245,160,110,0.5); color: #f5a06e;
  -webkit-tap-highlight-color: transparent;
}
.btn-p2:active:not(:disabled) { background: rgba(245,160,110,0.25); }
.btn-p2:disabled { opacity: 0.4; cursor: default; }

.divider {
  display: flex; align-items: center; gap: 10px; width: 100%;
  font-size: 12px; color: rgba(255,255,255,0.2);
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

.code-input {
  width: 100%; padding: 16px; border-radius: 14px; outline: none;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
  color: #e8e8f0; font-size: 22px; font-weight: 900; letter-spacing: 6px;
  text-align: center; text-transform: uppercase;
}
.code-input:focus { border-color: rgba(245,160,110,0.5); }

.big-code  { font-size: 52px; font-weight: 900; letter-spacing: 10px; color: #6ec6f5; }
.share-box {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  font-size: 12px; color: rgba(255,255,255,0.35); text-align: center; word-break: break-all;
}
.btn-copy {
  padding: 10px 22px; border-radius: 8px; cursor: pointer;
  background: transparent; border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.55); font-size: 13px;
  -webkit-tap-highlight-color: transparent;
}
.btn-copy:active { background: rgba(255,255,255,0.08); }
.wait-label { font-size: 14px; color: rgba(255,255,255,0.35); }

/* Map picker */
.map-label {
  align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: rgba(255,255,255,0.28);
}
.map-picks { display: flex; gap: 8px; width: 100%; }
.map-pick {
  flex: 1; padding: 10px 6px; border-radius: 10px; cursor: pointer;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  text-align: center; -webkit-tap-highlight-color: transparent; user-select: none;
  transition: background 0.12s, border-color 0.12s;
}
.map-pick.active {
  background: rgba(110,198,245,0.13); border-color: rgba(110,198,245,0.45);
}
.map-pick:active { opacity: 0.75; }
.map-pick-name { display: block; font-size: 13px; font-weight: 700; color: #e8e8f0; }
.map-pick-desc { display: block; font-size: 10px; color: rgba(255,255,255,0.32); margin-top: 2px; }

#game-screen { display: none; flex-direction: column; height: 100dvh; padding: 8px; gap: 8px; }
#game-screen.active { display: flex; }

#score-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; background: rgba(255,255,255,0.06); border-radius: 10px;
  flex-shrink: 0; font-size: 13px; gap: 8px;
}
.pi  { display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.pts { font-weight: 900; font-size: 17px; }
.you { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
#status { font-size: 12px; color: rgba(255,255,255,0.35); text-align: center; flex: 1; }

#canvas-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#gc { display: block; background: #1a1a2e; border-radius: 10px; max-width: 100%; max-height: 100%; }

#sw-btn {
  flex-shrink: 0; width: 100%; padding: 20px; border-radius: 16px; border: 2px solid;
  font-size: 22px; font-weight: 900; letter-spacing: 3px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
  transition: opacity 0.15s, transform 0.08s;
}
#sw-btn:active:not(:disabled) { transform: scale(0.97); }
#sw-btn:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<!-- ── Lobby ─────────────────────────────────────────────────────────────── -->
<div class="screen active" id="lobby-screen">
  <div class="title">Hoop Trains</div>
  <p class="sub">Race around circular hoops, switch tracks, collect stars.<br>First to 20 points wins!</p>
  <p class="map-label">Choose Map</p>
  <div class="map-picks" id="map-picks">
    <div class="map-pick active" data-map="0">
      <span class="map-pick-name">Classic</span>
      <span class="map-pick-desc">3 in a row</span>
    </div>
    <div class="map-pick" data-map="1">
      <span class="map-pick-name">Triangle</span>
      <span class="map-pick-desc">Hub &amp; spoke</span>
    </div>
    <div class="map-pick" data-map="2">
      <span class="map-pick-name">Grid</span>
      <span class="map-pick-desc">2×2 loops</span>
    </div>
  </div>
  <button class="btn-host" id="host-btn">Host a Game</button>
  <div class="divider">or play directly</div>
  <button class="btn-p1" id="create-btn">Create Game — Player 1</button>
  <div class="divider">or join a game</div>
  <input class="code-input" id="code-input" type="text" maxlength="6" placeholder="ROOM CODE" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
  <button class="btn-p2" id="join-btn">Join Game</button>
  <p class="err" id="lobby-err"></p>
</div>

<!-- ── Waiting ────────────────────────────────────────────────────────────── -->
<div class="screen" id="wait-screen">
  <p class="sub" id="wait-role" style="font-weight:700">You are Player 1</p>
  <p class="sub" id="wait-desc">Share this code with Player 2:</p>
  <div class="big-code" id="room-code">------</div>
  <div class="share-box" id="share-url"></div>
  <button class="btn-copy" id="copy-btn">Copy Link</button>
  <p class="wait-label" id="wait-status">Waiting for Player 2…</p>
</div>

<!-- ── Game ──────────────────────────────────────────────────────────────── -->
<div id="game-screen">
  <div id="score-bar">
    <div class="pi">
      <div class="dot" style="background:#6ec6f5"></div>
      P1&nbsp;<span class="pts" id="s1">0</span>
      <span class="you" id="you1" style="background:rgba(110,198,245,0.2);color:#6ec6f5;display:none">YOU</span>
    </div>
    <div id="status">●</div>
    <div class="pi">
      <span class="you" id="you2" style="background:rgba(245,160,110,0.2);color:#f5a06e;display:none">YOU</span>
      <span class="pts" id="s2">0</span>&nbsp;P2
      <div class="dot" style="background:#f5a06e"></div>
    </div>
  </div>
  <div id="canvas-wrap"><canvas id="gc" width="680" height="420"></canvas></div>
  <button id="sw-btn" disabled>SWITCH</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ── Constants ────────────────────────────────────────────────────────────────
const W = 680, H = 420;
const P_COLORS  = ['#6ec6f5', '#f5a06e'];
const P_RGB     = ['110,198,245', '245,160,110'];
const STAR_COL  = '#f5e56e';
const SW_COOL   = 1200;
const WIN_SCORE = 20;
const STAR_RESP = 1800;
const TICK_MS   = 33;

// ── Maps ─────────────────────────────────────────────────────────────────────
const MAPS = [
  {
    name: 'Classic',
    hoops: [
      { x: 170, y: 210, r: 120 },
      { x: 340, y: 210, r: 120 },
      { x: 510, y: 210, r: 120 },
    ],
    starts: [
      { hoop: 0, angle: Math.PI * 0.5, dir:  1, speed: 0.018 },
      { hoop: 2, angle: Math.PI * 1.5, dir: -1, speed: 0.022 },
    ],
  },
  {
    // Top hoop connects to both bottom hoops; bottom hoops are disconnected from each other.
    name: 'Triangle',
    hoops: [
      { x: 340, y: 140, r: 115 },  // top   [0]
      { x: 210, y: 310, r: 115 },  // bot-L [1]
      { x: 470, y: 310, r: 115 },  // bot-R [2]
    ],
    starts: [
      { hoop: 1, angle: Math.PI * 0.5, dir:  1, speed: 0.018 },
      { hoop: 2, angle: Math.PI * 1.5, dir: -1, speed: 0.022 },
    ],
  },
  {
    // 2×2 grid — all four hoops connected horizontally and vertically.
    name: 'Grid',
    hoops: [
      { x: 230, y: 140, r: 115 },  // top-L [0]
      { x: 450, y: 140, r: 115 },  // top-R [1]
      { x: 230, y: 300, r: 115 },  // bot-L [2]
      { x: 450, y: 300, r: 115 },  // bot-R [3]
    ],
    starts: [
      { hoop: 0, angle: Math.PI * 0.5, dir:  1, speed: 0.018 },
      { hoop: 3, angle: Math.PI * 1.5, dir: -1, speed: 0.022 },
    ],
  },
];

let selectedMapIdx = 0;
let activeHoops    = MAPS[0].hoops;

// ── Map picker ────────────────────────────────────────────────────────────────
document.getElementById('map-picks').addEventListener('click', e => {
  const pick = e.target.closest('[data-map]');
  if (!pick) return;
  selectedMapIdx = parseInt(pick.dataset.map, 10);
  document.querySelectorAll('.map-pick').forEach(el =>
    el.classList.toggle('active', el === pick)
  );
  unlockAudio();
});

// ── Roles ─────────────────────────────────────────────────────────────────────
//
//  HOST (dedicated):  isHost=true,  isServer=true,  myIdx=null
//  PLAYER 1 (P2P):    isHost=true,  isServer=false, myIdx=0
//  REMOTE PLAYER:     isHost=false, isServer=false, myIdx=0|1
//
let isHost      = false;
let isServer    = false;
let myIdx       = null;

let peer        = null;
let hostConn    = null;
let playerConns = [null, null];

// ── Game state ────────────────────────────────────────────────────────────────
let gameState     = null;
let trails        = [[], []];
let gameTimer     = null;
let cdTimer       = null;
let renderStarted = false;

// Audio event tracking
let prevScores    = [-1, -1];
let prevWinner    = null;
let prevCountdown = null;

// ── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, endFreq, type, gain, dur, startTime) {
  if (!audioCtx) return;
  const t = startTime ?? audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur);
}

function playSwitchSnd() {
  unlockAudio();
  playTone(330, 520, 'square', 0.12, 0.18);
}

function playCollectSnd() {
  unlockAudio();
  playTone(660, 1100, 'sine', 0.18, 0.22);
}

function playCountdownSnd() {
  unlockAudio();
  playTone(350, 350, 'sine', 0.14, 0.14);
}

function playGoSnd() {
  unlockAudio();
  playTone(600, 600, 'sine', 0.18, 0.08);
  setTimeout(() => playTone(800, 800, 'sine', 0.18, 0.12), 90);
}

function playWinSnd() {
  unlockAudio();
  if (!audioCtx) return;
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    playTone(freq, freq, 'sine', 0.18, 0.28, audioCtx.currentTime + i * 0.13);
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function show(id) {
  ['lobby-screen','wait-screen','game-screen'].forEach(sid => {
    const el = document.getElementById(sid);
    sid === id ? el.classList.add('active') : el.classList.remove('active');
  });
}

function showErr(msg) {
  const el = document.getElementById('lobby-err');
  el.textContent = msg;
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

function hPos(hoop, angle) {
  const h = activeHoops[hoop];
  return { x: h.x + Math.cos(angle) * h.r, y: h.y + Math.sin(angle) * h.r };
}

function genCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}

function setWaitScreen(role, desc, status, roleColor) {
  document.getElementById('wait-role').textContent = role;
  document.getElementById('wait-role').style.color = roleColor || 'rgba(110,198,245,0.8)';
  document.getElementById('wait-desc').textContent = desc;
  document.getElementById('wait-status').textContent = status;
}

function updateWaitStatus(joined) {
  document.getElementById('wait-status').textContent =
    joined >= 2 ? 'Both players ready — starting…'
    : `Waiting for players… (${joined}/2)`;
}

// Pre-fill room code from URL
const urlCode = new URLSearchParams(location.search).get('room');
if (urlCode) document.getElementById('code-input').value = urlCode.toUpperCase();

// ── Lobby: Host Game ──────────────────────────────────────────────────────────
document.getElementById('host-btn').addEventListener('click', () => {
  unlockAudio();
  const btn = document.getElementById('host-btn');
  btn.disabled = true; btn.textContent = 'Setting up…';

  const code = genCode();
  peer = new Peer(code.toLowerCase(), { debug: 0 });

  peer.on('open', () => {
    isHost = true; isServer = true; myIdx = null;
    playerConns = [null, null];
    setWaitScreen(
      'You are the Host',
      'Share this code with both players:',
      'Waiting for players… (0/2)',
      'rgba(180,180,220,0.8)'
    );
    document.getElementById('room-code').textContent = code;
    const link = `${location.origin}${location.pathname}?room=${code}`;
    document.getElementById('share-url').textContent = link;
    btn.disabled = false; btn.textContent = 'Host a Game';
    show('wait-screen');
  });

  peer.on('connection', onIncomingConnection);

  peer.on('error', err => {
    btn.disabled = false; btn.textContent = 'Host a Game';
    if (err.type === 'unavailable-id') document.getElementById('host-btn').click();
    else showErr('Could not host: ' + (err.message || err.type));
  });
});

// ── Lobby: Create Game — P1 (P2P) ─────────────────────────────────────────────
document.getElementById('create-btn').addEventListener('click', () => {
  unlockAudio();
  const btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = 'Creating…';

  const code = genCode();
  peer = new Peer(code.toLowerCase(), { debug: 0 });

  peer.on('open', () => {
    isHost = true; isServer = false; myIdx = 0;
    playerConns = ['local', null];
    setWaitScreen(
      'You are Player 1',
      'Share this code with Player 2:',
      'Waiting for Player 2…',
      'rgba(110,198,245,0.8)'
    );
    document.getElementById('room-code').textContent = code;
    const link = `${location.origin}${location.pathname}?room=${code}`;
    document.getElementById('share-url').textContent = link;
    btn.disabled = false; btn.textContent = 'Create Game — Player 1';
    show('wait-screen');
  });

  peer.on('connection', onIncomingConnection);

  peer.on('error', err => {
    btn.disabled = false; btn.textContent = 'Create Game — Player 1';
    if (err.type === 'unavailable-id') document.getElementById('create-btn').click();
    else showErr('Could not create room: ' + (err.message || err.type));
  });
});

// ── Shared: incoming connection handler ──────────────────────────────────────
function onIncomingConnection(incoming) {
  const idx = playerConns.indexOf(null);
  if (idx === -1) { incoming.close(); return; }

  incoming.on('open', () => {
    playerConns[idx] = incoming;
    incoming.on('data', data => onDataFromPlayer(data, idx));
    incoming.on('close', () => {
      playerConns[idx] = null;
      if (gameState) gameState.gameActive = false;
      document.getElementById('status').textContent = `Player ${idx + 1} disconnected`;
      refreshBtn();
    });

    incoming.send({ type: 'assigned', idx });

    const remoteCount = playerConns.filter(c => c && c !== 'local').length;

    if (isServer) {
      updateWaitStatus(remoteCount);
      if (playerConns[0] && playerConns[1]) {
        show('game-screen');
        setupGameScreen();
        beginCountdown();
      }
    } else {
      show('game-screen');
      setupGameScreen();
      beginCountdown();
    }
  });
}

// ── Lobby: Join Game ──────────────────────────────────────────────────────────
document.getElementById('join-btn').addEventListener('click', () => {
  unlockAudio();
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if (code.length < 6) { showErr('Enter the 6-character room code'); return; }

  const btn = document.getElementById('join-btn');
  btn.disabled = true; btn.textContent = 'Joining…';

  peer = new Peer({ debug: 0 });

  peer.on('open', () => {
    hostConn = peer.connect(code.toLowerCase(), { reliable: true, serialization: 'json' });

    let opened = false;
    hostConn.on('open', () => {
      opened = true;
      isHost = false;
      hostConn.on('data', onDataFromHost);
      hostConn.on('close', onPeerLeft);
      btn.disabled = false; btn.textContent = 'Join Game';
      show('game-screen');
      startRenderLoop();
      scaleCanvas();
    });

    setTimeout(() => {
      if (!opened) {
        btn.disabled = false; btn.textContent = 'Join Game';
        showErr('Room not found — check the code and try again');
        peer.destroy(); peer = null;
      }
    }, 8000);
  });

  peer.on('error', err => {
    btn.disabled = false; btn.textContent = 'Join Game';
    showErr('Connection failed: ' + (err.message || err.type));
  });
});

// ── Copy link ─────────────────────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', () => {
  const code = document.getElementById('room-code').textContent;
  const link = `${location.origin}${location.pathname}?room=${code}`;
  navigator.clipboard?.writeText(link).then(() => {
    const b = document.getElementById('copy-btn');
    b.textContent = 'Copied ✓';
    setTimeout(() => { b.textContent = 'Copy Link'; }, 2000);
  });
});

// ── Peer disconnect ───────────────────────────────────────────────────────────
function onPeerLeft() {
  stopTimers();
  if (gameState) gameState.gameActive = false;
  document.getElementById('status').textContent = 'Host disconnected';
  refreshBtn();
}

// ── Data: host → player ───────────────────────────────────────────────────────
function onDataFromHost(data) {
  if (data.type === 'assigned') {
    myIdx = data.idx;
    document.getElementById(myIdx === 0 ? 'you1' : 'you2').style.display = 'inline';
    const btn = document.getElementById('sw-btn');
    if (myIdx === 0) {
      btn.style.background  = 'rgba(110,198,245,0.12)';
      btn.style.borderColor = 'rgba(110,198,245,0.55)';
      btn.style.color       = '#6ec6f5';
    } else {
      btn.style.background  = 'rgba(245,160,110,0.12)';
      btn.style.borderColor = 'rgba(245,160,110,0.55)';
      btn.style.color       = '#f5a06e';
    }
    return;
  }
  if (data.type !== 'state') return;
  const s = data.state;
  // Sync map for remote players
  if (s.mapIdx !== undefined && MAPS[s.mapIdx]) {
    activeHoops = MAPS[s.mapIdx].hoops;
  }
  if (gameState && gameState.winner !== null && s.winner === null) {
    trails = [[], []];
    prevScores = [-1, -1]; prevWinner = null; prevCountdown = null;
  }
  gameState = s;
  checkAudioEvents();
  refreshUI();
  refreshBtn();
}

// ── Data: player → host ───────────────────────────────────────────────────────
function onDataFromPlayer(data, playerIdx) {
  if (!gameState) return;
  if (data.type === 'switch' && gameState.gameActive) doSwitch(gameState, playerIdx);
  if (data.type === 'restart' && gameState.winner !== null) restartGame();
}

// ── Broadcast state ───────────────────────────────────────────────────────────
function broadcast() {
  playerConns.forEach(c => {
    if (c && c !== 'local' && c.open) c.send({ type: 'state', state: gameState });
  });
}

// ── Game logic (runs on host) ─────────────────────────────────────────────────
function makeState() {
  const map = MAPS[selectedMapIdx];
  return {
    mapIdx: selectedMapIdx,
    players: map.starts.map(s => ({
      hoop: s.hoop, angle: s.angle, speed: s.speed, dir: s.dir,
      score: 0, lapCount: 0, lastAngle: s.angle, switchCooldown: 0,
    })),
    stars: genStars(),
    gameActive: false,
    winner: null,
    countdown: null,
  };
}

function genStars() {
  const s = [];
  for (let h = 0; h < activeHoops.length; h++) {
    s.push(
      { hoop: h, angle: Math.random() * Math.PI * 2,           collected: false },
      { hoop: h, angle: Math.random() * Math.PI * 2 + Math.PI, collected: false }
    );
  }
  return s;
}

function doSwitch(state, idx) {
  const p = state.players[idx];
  if (p.switchCooldown > 0) return;
  const pos = hPos(p.hoop, p.angle);
  let best = null, bestDiff = Infinity;
  activeHoops.forEach((h, i) => {
    if (i === p.hoop) return;
    const dx = pos.x - h.x, dy = pos.y - h.y;
    const diff = Math.abs(Math.sqrt(dx * dx + dy * dy) - h.r);
    if (diff < 28 && diff < bestDiff) { bestDiff = diff; best = i; }
  });
  if (best !== null) {
    const h = activeHoops[best];
    p.angle = Math.atan2(pos.y - h.y, pos.x - h.x);
    p.hoop = best;
    p.switchCooldown = SW_COOL;
  }
}

function tick(state, dt) {
  if (!state.gameActive) return;
  const scale = dt / (1000 / 60);
  state.players.forEach((p, i) => {
    p.angle += p.speed * p.dir * scale;
    if (p.switchCooldown > 0) p.switchCooldown = Math.max(0, p.switchCooldown - dt);
    const a  = ((p.angle     % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const la = ((p.lastAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    if (p.dir > 0 ? (la > 5.5 && a < 0.8) : (la < 0.8 && a > 5.5)) p.lapCount++;
    p.lastAngle = p.angle;
    const pos = hPos(p.hoop, p.angle);
    for (const s of state.stars) {
      if (s.collected || s.hoop !== p.hoop) continue;
      const sp = hPos(s.hoop, s.angle);
      const dx = pos.x - sp.x, dy = pos.y - sp.y;
      if (dx * dx + dy * dy < 324) {
        s.collected = true; p.score++;
        if (p.score >= WIN_SCORE) { state.gameActive = false; state.winner = i; }
        setTimeout(() => {
          s.hoop = Math.floor(Math.random() * activeHoops.length);
          s.angle = Math.random() * Math.PI * 2;
          s.collected = false;
        }, STAR_RESP);
      }
    }
  });
}

function stopTimers() {
  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  if (cdTimer)   { clearInterval(cdTimer);   cdTimer   = null; }
}

function beginCountdown() {
  stopTimers();
  trails = [[], []];
  prevScores = [-1, -1]; prevWinner = null; prevCountdown = null;
  activeHoops = MAPS[selectedMapIdx].hoops;
  gameState = makeState();
  gameState.countdown = 3;
  broadcast(); refreshUI(); refreshBtn();

  let n = 3;
  cdTimer = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(cdTimer); cdTimer = null;
      gameState.countdown = 0;
      broadcast(); refreshUI();
      setTimeout(() => {
        gameState.countdown = null; gameState.gameActive = true;
        broadcast(); refreshUI(); refreshBtn();
        startLoop();
      }, 600);
    } else {
      gameState.countdown = n;
      broadcast(); refreshUI();
    }
  }, 1000);
}

function startLoop() {
  let last = Date.now();
  gameTimer = setInterval(() => {
    const now = Date.now();
    tick(gameState, now - last); last = now;
    checkAudioEvents();
    broadcast();
    if (!gameState.gameActive) {
      clearInterval(gameTimer); gameTimer = null;
      refreshUI(); refreshBtn(); broadcast();
    }
  }, TICK_MS);
}

function restartGame() {
  stopTimers();
  setTimeout(beginCountdown, 400);
}

// ── Audio events ──────────────────────────────────────────────────────────────
function checkAudioEvents() {
  if (!gameState) return;
  const { players, winner, countdown } = gameState;

  players.forEach((p, i) => {
    if (p.score > prevScores[i]) { playCollectSnd(); prevScores[i] = p.score; }
  });

  if (winner !== null && prevWinner === null) playWinSnd();
  prevWinner = winner;

  if (countdown !== prevCountdown) {
    if (countdown !== null && countdown > 0) playCountdownSnd();
    if (countdown === 0) playGoSnd();
    prevCountdown = countdown;
  }
}

// ── Game screen ───────────────────────────────────────────────────────────────
function setupGameScreen() {
  if (isServer) {
    const btn = document.getElementById('sw-btn');
    btn.style.background  = 'rgba(180,180,220,0.08)';
    btn.style.borderColor = 'rgba(180,180,220,0.3)';
    btn.style.color       = 'rgba(180,180,220,0.5)';
  } else if (myIdx !== null) {
    document.getElementById(myIdx === 0 ? 'you1' : 'you2').style.display = 'inline';
    const btn = document.getElementById('sw-btn');
    if (myIdx === 0) {
      btn.style.background  = 'rgba(110,198,245,0.12)';
      btn.style.borderColor = 'rgba(110,198,245,0.55)';
      btn.style.color       = '#6ec6f5';
    } else {
      btn.style.background  = 'rgba(245,160,110,0.12)';
      btn.style.borderColor = 'rgba(245,160,110,0.55)';
      btn.style.color       = '#f5a06e';
    }
  }

  scaleCanvas();
  window.addEventListener('resize', scaleCanvas);
  startRenderLoop();
}

function startRenderLoop() {
  if (renderStarted) return;
  renderStarted = true;
  requestAnimationFrame(renderLoop);
}

function scaleCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}

// ── Switch button ─────────────────────────────────────────────────────────────
const swBtn = document.getElementById('sw-btn');

function handleSwitch() {
  if (!gameState) return;
  if (gameState.gameActive) {
    playSwitchSnd();
    if (isHost && myIdx === 0) {
      doSwitch(gameState, 0);
    } else if (!isHost && hostConn?.open) {
      hostConn.send({ type: 'switch' });
    }
  } else if (gameState.winner !== null) {
    if (isServer || myIdx === 0) {
      restartGame();
    } else if (hostConn?.open) {
      hostConn.send({ type: 'restart' });
    }
  }
}

swBtn.addEventListener('touchstart', e => { e.preventDefault(); handleSwitch(); }, { passive: false });
swBtn.addEventListener('click', handleSwitch);

document.addEventListener('keydown', e => {
  if (myIdx === 0 && (e.key === 'a' || e.key === 'A')) handleSwitch();
  if (myIdx === 1 && (e.key === 'l' || e.key === 'L')) handleSwitch();
});

function refreshBtn() {
  const s = gameState;

  if (isServer) {
    if (!s || s.countdown !== null || s.gameActive) {
      swBtn.textContent = 'HOSTING'; swBtn.disabled = true;
    } else if (s.winner !== null) {
      swBtn.textContent = 'PLAY AGAIN'; swBtn.disabled = false;
    } else {
      swBtn.textContent = 'HOSTING'; swBtn.disabled = true;
    }
    return;
  }

  if (!s || s.countdown !== null) { swBtn.textContent = 'SWITCH'; swBtn.disabled = true; return; }
  if (s.gameActive)               { swBtn.textContent = 'SWITCH'; swBtn.disabled = false; return; }
  if (s.winner !== null) {
    if (myIdx === 0) { swBtn.textContent = 'PLAY AGAIN'; swBtn.disabled = false; }
    else             { swBtn.textContent = 'WAITING…';   swBtn.disabled = true;  }
    return;
  }
  swBtn.textContent = 'SWITCH'; swBtn.disabled = true;
}

// ── UI ────────────────────────────────────────────────────────────────────────
function refreshUI() {
  if (!gameState) return;
  document.getElementById('s1').textContent = gameState.players[0].score;
  document.getElementById('s2').textContent = gameState.players[1].score;
  const { countdown, gameActive, winner } = gameState;
  const el = document.getElementById('status');
  if (countdown !== null && countdown > 0) el.textContent = `Starting in ${countdown}…`;
  else if (countdown === 0)                el.textContent = 'GO!';
  else if (winner !== null)                el.textContent = `P${winner + 1} wins!`;
  else if (gameActive)                     el.textContent = '★ Collect stars!';
  else                                     el.textContent = '●';
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function drawMap() {
  // Hoops
  activeHoops.forEach(h => {
    ctx.save();
    ctx.strokeStyle = 'rgba(180,180,220,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  });
  // Dashed connectors between overlapping hoops
  for (let i = 0; i < activeHoops.length; i++) {
    for (let j = i + 1; j < activeHoops.length; j++) {
      const a = activeHoops[i], b = activeHoops[j];
      if (Math.hypot(b.x - a.x, b.y - a.y) < a.r + b.r) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy);
        // perpendicular direction
        const nx = -dy / len * 18, ny = dx / len * 18;
        ctx.save();
        ctx.strokeStyle = 'rgba(180,180,220,0.12)';
        ctx.setLineDash([4, 8]); ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(mx - nx, my - ny);
        ctx.lineTo(mx + nx, my + ny);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }
  }
}

function drawStar(s) {
  if (s.collected) return;
  const { x, y } = hPos(s.hoop, s.angle);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(Date.now() * 0.002);
  ctx.fillStyle = STAR_COL; ctx.shadowColor = STAR_COL; ctx.shadowBlur = 8;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 9 : 4;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    i === 0 ? ctx.moveTo(r * Math.cos(a), r * Math.sin(a)) : ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawTrain(p, idx) {
  const { x, y } = hPos(p.hoop, p.angle);
  const col = P_COLORS[idx], rgb = P_RGB[idx];
  trails[idx].push({ x, y });
  if (trails[idx].length > 20) trails[idx].shift();
  ctx.save();
  trails[idx].forEach((pt, i) => {
    ctx.fillStyle = `rgba(${rgb},${(i / trails[idx].length) * 0.35})`;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 3 * (i / trails[idx].length), 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
  const h = activeHoops[p.hoop];
  const tang = Math.atan2(y - h.y, x - h.x) + Math.PI / 2 * p.dir;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(tang);
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.roundRect(-7, -5, 14, 10, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(5, 0, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(-3, -5, 2, 0, Math.PI * 2); ctx.arc(3, -5, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (p.switchCooldown > 0) {
    const frac = p.switchCooldown / SW_COOL;
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = frac * 0.6;
    ctx.beginPath(); ctx.arc(x, y, 14, -Math.PI / 2, -Math.PI / 2 + (1 - frac) * Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawOverlay(big, small, color) {
  ctx.save();
  ctx.fillStyle = 'rgba(26,26,46,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#e8e8f0'; ctx.font = 'bold 42px system-ui';
  ctx.fillText(big, W / 2, H / 2 - (small ? 24 : 0));
  if (small) {
    ctx.font = '16px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText(small, W / 2, H / 2 + 22);
  }
  ctx.restore();
}

function renderLoop() {
  requestAnimationFrame(renderLoop);
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, W, H);
  drawMap();

  if (!gameState) {
    const msg = isServer
      ? `Waiting for players… (${playerConns.filter(c => c && c !== 'local').length}/2)`
      : 'Waiting…';
    drawOverlay(msg, null, '#e8e8f0');
    return;
  }

  const { players, stars, gameActive, winner, countdown } = gameState;
  stars.forEach(drawStar);
  players.forEach(drawTrain);

  if (countdown !== null) {
    drawOverlay(countdown > 0 ? String(countdown) : 'GO!', 'Get ready…', '#e8e8f0');
  } else if (winner !== null) {
    drawOverlay(`Player ${winner + 1} Wins!`, `P1: ${players[0].score} pts  |  P2: ${players[1].score} pts`, P_COLORS[winner]);
  }
}

// Initial canvas paint
ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, W, H);
drawMap();
</script>
